plugins {
    id "com.android.application"
}

android {
    namespace "com.andrej.parallaxwallpaper"
    compileSdk 35

    defaultConfig {
        applicationId "com.andrej.parallaxwallpaper"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "0.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
